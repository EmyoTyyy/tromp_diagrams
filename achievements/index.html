function toggleNav() {
  document.getElementById('navDrawer').classList.toggle('open');
  document.getElementById('navOverlay').classList.toggle('open');

<script src="../js/site.js"></script>
<script src="../js/achievements.js"></script>
<script>
(function renderAchievements() {
  const list = (typeof window.achievementStatus === 'function')
    ? window.achievementStatus() : [];
  const unlocked = list.filter(a => a.unlocked).length;
  const total = list.length;
  document.getElementById('achSummary').innerHTML =
    '<span class="ach-count">' + unlocked + ' / ' + total + '</span> unlocked' +
    '<div class="ach-progress"><div class="ach-progress-fill" style="width:' +
    (total ? (unlocked / total * 100) : 0) + '%"></div></div>';

  const grid = document.getElementById('achGrid');
  grid.innerHTML = list.map(a => {
    // Locked: title is visible as a small teaser. The descriptive
    // hint and the icon stay hidden until the achievement actually
    // fires — that way the player gets a name to chase without
    // being told exactly what unlocks it. Gold-tier achievements
    // also wear a warm-amber frame so users can spot the rare ones
    // at a glance even before they're unlocked.
    const icon = a.unlocked ? a.icon : '?';
    const hint = a.unlocked ? a.hint : '???';
    const cls  = 'ach-card' +
      (a.unlocked ? ' unlocked' : ' locked') +
      (a.gold ? ' gold' : '');
    return '<div class="' + cls + '">' +
      '<div class="ach-icon">' + icon + '</div>' +
      '<div class="ach-body">' +
        '<div class="ach-title">' + a.title + '</div>' +
        '<div class="ach-hint">' + hint + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
})();
</script>
